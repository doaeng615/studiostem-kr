<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>관리자 로그인 | Studio Stem</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="../css/tokens.css?v=43" />
<link rel="stylesheet" href="../css/admin.css?v=43" />
</head>
<body class="admin-body">
  <div class="admin-login">
    <form class="admin-login__card" id="loginForm">
      <div class="admin-login__logo">
        <img src="../assets/logo-full.svg" alt="Studio Stem" />
      </div>
      <p class="admin-login__title">관리자 로그인</p>

      <div class="admin-field">
        <label for="email">이메일</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="admin-field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>

      <p class="admin-error" id="loginError" style="display:none;"></p>

      <button type="submit" class="admin-btn admin-btn--primary" id="loginBtn">로그인</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/supabase-config.js?v=43"></script>
  <script>
    (async function () {
      const { data } = await supabaseClient.auth.getSession();
      if (data.session) location.href = "dashboard.html";
    })();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const errEl = document.getElementById("loginError");
      errEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "로그인 중...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        errEl.textContent = "이메일 또는 비밀번호가 올바르지 않습니다.";
        errEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "로그인";
        return;
      }
      location.href = "dashboard.html";
    });
  </script>
</body>
</html>
